name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

  canvas-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: modelboard
          POSTGRES_USER: modelboard
          POSTGRES_PASSWORD: modelboard
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U modelboard -d modelboard"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: canvas-e2e-results
          path: test-results/

  server-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Configure isolated server
        run: |
          printf '127.0.0.2 modelboard.test\n' | sudo tee -a /etc/hosts
          cat > .env.server.ci <<'ENV'
          POSTGRES_DB=modelboard
          POSTGRES_USER=modelboard
          POSTGRES_PASSWORD=ci_server_password
          JWT_SECRET=ci_server_jwt_key_only_for_isolated_tests_0123456789
          OWNER_PASSWORD=ci_owner_password_012345
          EDITOR_PASSWORD=ci_editor_password_012345
          WEB_BIND_ADDRESS=127.0.0.2
          WEB_PORT=8080
          WEB_ORIGIN=http://modelboard.test:8080
          ENV
      - name: Build and start the server stack
        run: docker compose --env-file .env.server.ci -f docker-compose.server.yml up -d --build --wait --wait-timeout 180
      - run: npx playwright install --with-deps chromium
      - name: Two participants through ordinary HTTP and WebSocket
        env:
          MODELBOARD_SERVER_URL: http://modelboard.test:8080
        run: npm run test:server
      - name: Server diagnostics
        if: failure()
        run: docker compose --env-file .env.server.ci -f docker-compose.server.yml logs --no-color --tail=150
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: server-e2e-results
          path: test-results/
      - name: Stop isolated server
        if: always()
        run: docker compose --env-file .env.server.ci -f docker-compose.server.yml down -v
