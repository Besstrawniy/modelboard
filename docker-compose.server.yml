services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-modelboard}
      POSTGRES_USER: ${POSTGRES_USER:-modelboard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.server}
    volumes:
      - modelboard_pg:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-modelboard} -d ${POSTGRES_DB:-modelboard}"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      target: server
    restart: unless-stopped
    init: true
    working_dir: /app/apps/api
    command: ["node", "--import", "tsx", "src/main.ts"]
    environment: &server_environment
      DATABASE_URL: postgresql://${POSTGRES_USER:-modelboard}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.server}@postgres:5432/${POSTGRES_DB:-modelboard}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env.server}
      API_HOST: 0.0.0.0
      API_PORT: "3001"
      COLLAB_PORT: "1234"
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:8080}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      start_period: 20s
      retries: 20

  collab:
    build:
      context: .
      target: server
    restart: unless-stopped
    init: true
    working_dir: /app/apps/collab
    command: ["node", "--import", "tsx", "src/server.ts"]
    environment: *server_environment
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "const net=require('node:net');const s=net.connect(1234,'127.0.0.1',()=>{s.end();process.exit(0)});s.on('error',()=>process.exit(1));s.setTimeout(3000,()=>process.exit(1));"]
      interval: 5s
      timeout: 5s
      start_period: 10s
      retries: 20

  web:
    build:
      context: .
      target: web
    restart: unless-stopped
    ports:
      - "${WEB_BIND_ADDRESS:-0.0.0.0}:${WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
        restart: true
      collab:
        condition: service_healthy
        restart: true

volumes:
  modelboard_pg:
